[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radio-parra"
version = "0.1.0"
description = "Radio casera con música Tiny Desk, locutor IA y segmentos factuales/ficción"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "jinja2>=3",
    "httpx>=0.27",
    "feedparser>=6",
    "mutagen>=1.47",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-ulid>=2",
    "pyyaml>=6",
]

[project.scripts]
radio = "radio.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "pre-commit>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/radio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]
