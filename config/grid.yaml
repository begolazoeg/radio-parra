# Configuración de la parrilla de programación — ejemplo Madrid
timezone: "Europe/Madrid"

# Porcentaje máximo de tiempo de antena dedicado a palabra (host, factual, ficción)
talk_budget_ratio: 0.30

# Cooldowns mínimos entre segmentos del mismo tipo (minutos)
cooldowns_minutes:
  factual: 15
  fiction: 30
  time_signal: 55
  jingle: 10

# Señal horaria activada
time_signal_enabled: true

# Franjas horarias
slots:
  - name: "manana"
    start: "07:00"
    end: "13:00"
    music_ratio: 0.65
    max_talk_run_min: 4

  - name: "tarde"
    start: "13:00"
    end: "21:00"
    music_ratio: 0.70
    max_talk_run_min: 3

  - name: "noche"
    start: "21:00"
    end: "07:00"
    music_ratio: 0.80
    max_talk_run_min: 2
