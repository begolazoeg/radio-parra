# Configuración global de la emisora (§5 de ARCHITECTURE.md)

# Nombre provisional: decisión abierta #1 (afecta a jingles y prompts)
name: "Radio Parra"

timezone: "Europe/Madrid"

# Idioma de la radio: decisión abierta #2 (¿solo español o alternar con catalán?)
language: "es"

# Directorio de datos: state.db, stock/<kind>/, tmp/ (en .gitignore)
data_dir: "data"

# Presupuesto mensual en euros para APIs externas (regla de gasto, §4.2)
budget:
  monthly_eur: 10.0

# Nivel de loudness objetivo (EBU R128)
loudness_lufs: -16.0

# Proveedores (§4.1, inv. 6). Los ejecutan solo los productores (`radio produce`),
# nunca la emisora (inv. 2). Si falta algo (clave, binario, modelo de voz), el
# productor que lo necesita registra el error en producer_runs y la música sigue.
providers:
  llm:
    # Claude por la API oficial (alias: anthropic). "fake" para probar sin red.
    # Credenciales: ANTHROPIC_API_KEY (en .env, que systemd carga) o `ant auth login`.
    name: "claude"
    model: "claude-sonnet-5"   # decisión de la dueña (2026-09-24)
    extra:
      # Pensamiento adaptativo con esfuerzo bajo (ver radio/providers/llm/claude.py):
      # evita que se cuelen etiquetas de razonamiento en un texto que se locuta.
      # "disabled" es más barato y predecible si todo se pide con esquema JSON.
      thinking: "adaptive"
      effort: "low"
      min_max_tokens_adaptive: 2000   # el pensamiento cuenta dentro de max_tokens
      timeout_s: 60
      max_retries: 2                  # el SDK reintenta 408/409/429/5xx y red
      # Cambio USD→EUR aproximado para la regla de gasto (actualizar a mano).
      usd_to_eur: 0.92
      # Precios USD por millón de tokens (cacheados 2026-06; VERIFICAR). Se pueden
      # sobrescribir aquí, p. ej.:
      # prices: {claude-sonnet-5: {input: 2.0, output: 10.0}}
  tts:
    # TTS local y offline por defecto (decisión #3, 2026-09-24). Alternativas:
    # "cloud"/"elevenlabs" (implementado pero desactivado; necesita
    # ELEVENLABS_API_KEY y verificar la API antes de usarlo) y "fake".
    name: "piper"
    extra:
      binary: "piper"                 # ruta o nombre en el PATH
      models_dir: "data/models/piper" # modelos .onnx + .onnx.json, instalados a mano
      args: []                        # p. ej. ["--length_scale", "1.05"]
      timeout_s: 120
      # Caché por hash(texto + voz + proveedor): no se sintetiza dos veces lo mismo
      cache_dir: "data/cache/tts"

# ── Emisora (radio station, §4.4) ─────────────────────────────────────────────
# Salida de audio: lo único que cambia entre el portátil y la Pi (§1 inv. 10).
audio:
  mpv_bin: "mpv"
  mpv_args: []               # p. ej. ["--audio-device=alsa/plughw:CARD=sndrpihifiberry"]

# Interrupciones de la parrilla (señal horaria, grid.yaml → interrupts)
interrupts:
  # true: a la hora exacta se corta la música en curso (cortar un concierto es dejar
  # de reproducirlo, no modificar el archivo; ver ADR 0002).
  # false: la interrupción espera a que acabe lo que suena; si así llega más tarde
  # que max_late_seconds, se omite.
  cut_music: true

playout:
  lookahead_units: 2         # unidades en cola por detrás de lo que suena
  emergency_dir: "assets/emergency"
  emergency_retry_s: 30      # tras el peldaño 5, reintento de programación
