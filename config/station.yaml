# Configuración global de la emisora (§5 de ARCHITECTURE.md)

# Nombre provisional: decisión abierta #1 (afecta a jingles y prompts)
name: "Radio Parra"

timezone: "Europe/Madrid"

# Idioma de la radio: decisión abierta #2 (¿solo español o alternar con catalán?)
language: "es"

# Directorio de datos: state.db, stock/<kind>/, tmp/ (en .gitignore)
data_dir: "data"

# Presupuesto mensual en euros para APIs externas (regla de gasto, §4.2)
budget:
  monthly_eur: 10.0

# Nivel de loudness objetivo (EBU R128)
loudness_lufs: -16.0

providers:
  llm:
    name: "anthropic"
    model: "claude-haiku-4-5-20251001"
  tts:
    name: "elevenlabs"

# ── Emisora (radio station, §4.4) ─────────────────────────────────────────────
# Salida de audio: lo único que cambia entre el portátil y la Pi (§1 inv. 10).
audio:
  mpv_bin: "mpv"
  mpv_args: []               # p. ej. ["--audio-device=alsa/plughw:CARD=sndrpihifiberry"]
  # Normalización en reproducción: cada archivo suena con una ganancia propia hacia
  # loudness_lufs, calculada con la medida guardada en meta (loudness_lufs y
  # true_peak_db). El archivo NO se toca: la música de Tiny Desk no se puede
  # modificar (ADR 0002). La palabra ya sale normalizada de `post` (0 dB).
  # Stock antiguo sin medida: `radio analyze-loudness --missing-only`.
  normalize: true
  gain_min_db: -12.0         # como mucho se baja 12 dB...
  gain_max_db: 6.0           # ...y se sube 6 dB
  true_peak_ceiling_db: -1.0 # pico verdadero + ganancia nunca por encima de −1 dBTP

# Interrupciones de la parrilla (señal horaria, grid.yaml → interrupts)
interrupts:
  # true: a la hora exacta se corta la música en curso (cortar un concierto es dejar
  # de reproducirlo, no modificar el archivo; ver ADR 0002).
  # false: la interrupción espera a que acabe lo que suena; si así llega más tarde
  # que max_late_seconds, se omite.
  cut_music: true

playout:
  lookahead_units: 2         # unidades en cola por detrás de lo que suena
  emergency_dir: "assets/emergency"
  emergency_retry_s: 30      # tras el peldaño 5, reintento de programación
