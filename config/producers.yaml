# Productores (§5 de ARCHITECTURE.md): activo, target_stock, cron y parámetros.
# cron: 5 campos en hora local de la emisora; sin cron = solo `radio produce` manual.
producers:
  time_signal:
    active: true
    target_stock: 2
    cron: "*/30 * * * *"
    params: {}

  music_tinydesk:
    active: false
    target_stock: 30
    cron: "0 */6 * * *"
    params:
      feed_url: null        # decisión abierta #8: la aporta la dueña
      max_cache_items: 60
