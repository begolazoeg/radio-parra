# Voces disponibles para TTS (§5 de ARCHITECTURE.md)
# Regla de carga: toda voz necesita consent: true y una consent_note no vacía.
# La voz del locutor (sintética genérica o clonada) es la decisión abierta #4:
# de momento solo hay una voz genérica provisional.
voices:
  - id: locutor_principal
    role: host
    provider: cloud
    provider_voice_id: "<pendiente>"
    language: es
    consent: true
    consent_note: "Voz sintética genérica del proveedor"
